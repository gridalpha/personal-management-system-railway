; Railway variables must reach $_ENV: this app reads $_ENV['UPLOAD_DIR'] and friends
; directly, and PHP's default variables_order ("GPCS") never populates it.
variables_order = "EGPCS"

; Sized for Railway's 8 GB container quota alongside pm.max_children in fpm-pool.conf,
; not for the 48-core host the runtime reports.
memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 108M
max_execution_time = 120
expose_php = Off
date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

[apcu]
apc.enabled = 1
apc.enable_cli = 1
apc.shm_size = 64M
