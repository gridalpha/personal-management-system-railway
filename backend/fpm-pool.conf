[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data

; php-fpm ships clear_env = yes, which would hide every Railway variable from PHP.
clear_env = no

; Worker stdout/stderr is discarded unless this is on, which would silently swallow
; every Symfony fatal on an otherwise healthy container.
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500
